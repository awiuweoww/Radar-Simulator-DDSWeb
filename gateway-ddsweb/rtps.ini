[common]
DCPSDefaultDiscovery=rtps
DCPSGlobalTransportConfig=$file
DCPSBit=0

[rtps_discovery/rtps]
ResendPeriod=2
SedpMulticast=1

[config/rtps_config]
transports=rtps_transport

[transport/rtps_transport]
transport_type=rtps_udp
rcv_buffer_size=16777216
snd_buffer_size=16777216
max_packet_size=1400
nak_responses_delay=0
nak_delay=2
heartbeat_period=100
heartbeat_response_delay=0
